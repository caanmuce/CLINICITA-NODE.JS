services:
  mysql:
    image: mysql:8.0
    container_name: clinicita-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-clinicita123}
      MYSQL_DATABASE: ${DB_NAME:-clinicitabd}
    ports:
      - "${MYSQL_HOST_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/bd.sql:/docker-entrypoint-initdb.d/01-bd.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.12.1
    container_name: clinicita-mlflow
    restart: unless-stopped
    ports:
      - "${MLFLOW_HOST_PORT:-5000}:5000"
    command: >-
      mlflow server --host 0.0.0.0 --port 5000
      --backend-store-uri sqlite:///mlflow.db
      --default-artifact-root /mlflow/artifacts
    volumes:
      - mlflow_data:/mlflow

  ml-service:
    build:
      context: ./ml-service
    container_name: clinicita-ml
    restart: unless-stopped
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: ${DB_USER:-root}
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:-clinicita123}
      DB_NAME: ${DB_NAME:-clinicitabd}
      MLFLOW_TRACKING_URI: http://mlflow:5000
    ports:
      - "${ML_HOST_PORT:-8000}:8000"
    depends_on:
      mysql:
        condition: service_healthy
      mlflow:
        condition: service_started
    volumes:
      - ml_models:/models

  backend:
    build:
      context: .
    container_name: clinicita-backend
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 3000
      TOKEN_SECRET: ${TOKEN_SECRET:-clinicita-clave-local-cambiar-en-produccion}
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: ${DB_USER:-root}
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:-clinicita123}
      DB_NAME: ${DB_NAME:-clinicitabd}
      ML_SERVICE_URL: http://ml-service:8000
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      ENABLE_WHATSAPP: ${ENABLE_WHATSAPP:-false}
      ENABLE_WHATSAPP_CHATBOT: ${ENABLE_WHATSAPP_CHATBOT:-false}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash-lite}
      CLINIC_TIMEZONE: ${CLINIC_TIMEZONE:-America/Bogota}
      CLINIC_UTC_OFFSET: ${CLINIC_UTC_OFFSET:--05:00}
      AUTH_RATE_LIMIT_MAX: ${AUTH_RATE_LIMIT_MAX:-50}
    ports:
      - "${BACKEND_HOST_PORT:-3000}:3000"
    depends_on:
      mysql:
        condition: service_healthy
      ml-service:
        condition: service_started

volumes:
  mysql_data:
  mlflow_data:
  ml_models:
