services:
  mysql:
    image: mysql:8.0
    container_name: clinicita-mysql
    restart: unless-stopped
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-clinicita123}
      MYSQL_DATABASE: ${DB_NAME:-clinicitabd}
    ports:
      - "${MYSQL_HOST_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/bd.sql:/docker-entrypoint-initdb.d/01-bd.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.12.1
    container_name: clinicita-mlflow
    restart: unless-stopped
    ports:
      - "${MLFLOW_HOST_PORT:-5000}:5000"
    command: >-
      mlflow server --host 0.0.0.0 --port 5000
      --backend-store-uri sqlite:///mlflow.db
      --default-artifact-root /mlflow/artifacts
    volumes:
      - mlflow_data:/mlflow

  ml-service:
    build:
      context: ./ml-service
    container_name: clinicita-ml
    restart: unless-stopped
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: ${DB_USER:-root}
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:-clinicita123}
      DB_NAME: ${DB_NAME:-clinicitabd}
      MLFLOW_TRACKING_URI: http://mlflow:5000
      ML_SERVICE_SECRET_KEY: ${ML_SERVICE_SECRET_KEY:-clinicita-ml-secret-key-default}
      DEVELOPER_MODE: ${DEVELOPER_MODE:-false}
    ports:
      - "${ML_HOST_PORT:-8000}:8000"
    depends_on:
      mysql:
        condition: service_healthy
      mlflow:
        condition: service_started
    volumes:
      # El modelo entrenado se mantiene fuera del repositorio público.
      - ml_models:/models:rw

  backend:
    build:
      context: .
    container_name: clinicita-backend
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 3000
      TOKEN_SECRET: ${TOKEN_SECRET:-clinicita-clave-local-cambiar-en-produccion}
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: ${DB_USER:-root}
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:-clinicita123}
      DB_NAME: ${DB_NAME:-clinicitabd}
      ML_SERVICE_URL: http://ml-service:8000
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      ENABLE_WHATSAPP: ${ENABLE_WHATSAPP:-false}
      ENABLE_WHATSAPP_CHATBOT: ${ENABLE_WHATSAPP_CHATBOT:-false}
      DEVELOPER_MODE: ${DEVELOPER_MODE:-false}
      OMNIROUTE_API_KEY: ${OMNIROUTE_API_KEY:-}
      OMNIROUTE_BASE_URL: ${OMNIROUTE_BASE_URL:-http://host.docker.internal:20128/v1}
      CLINIC_TIMEZONE: ${CLINIC_TIMEZONE:-America/Bogota}
      CLINIC_UTC_OFFSET: ${CLINIC_UTC_OFFSET:--05:00}
      ML_SERVICE_SECRET_KEY: ${ML_SERVICE_SECRET_KEY:-clinicita-ml-secret-key-default}
      SMS_PROVIDER: ${SMS_PROVIDER:-mock}
      SMS_GATEWAY_URL: ${SMS_GATEWAY_URL:-http://192.168.1.100:8080}
      SMS_GATEWAY_USER: ${SMS_GATEWAY_USER:-sms}
      SMS_GATEWAY_PASSWORD: ${SMS_GATEWAY_PASSWORD:-}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_FROM_NUMBER: ${TWILIO_FROM_NUMBER:-}
      AUTH_RATE_LIMIT_MAX: ${AUTH_RATE_LIMIT_MAX:-50}
    ports:
      - "${BACKEND_HOST_PORT:-3000}:3000"
    volumes:
      # Conserva la sesión vinculada de WhatsApp entre recreaciones.
      - whatsapp_auth:/app/server/.wwebjs_auth
    depends_on:
      mysql:
        condition: service_healthy
      ml-service:
        condition: service_started

volumes:
  mysql_data:
  mlflow_data:
  whatsapp_auth:
  ml_models:
