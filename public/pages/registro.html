<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Registro | CliniCita</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/estilos.css">
</head>
<body class="auth-page d-flex align-items-center py-5">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-7 col-lg-6">
                <p class="text-center mb-4"><a href="../index.html" class="navbar-brand-text text-decoration-none"><i class="bi bi-heart-pulse-fill me-1"></i>Clini<span>Cita</span></a></p>
                <div class="auth-card">
                    <div class="auth-head" style="background:var(--clinicita-mid);"><h1 class="h5 mb-0">Crear cuenta</h1></div>
                    <div class="p-4">
                        <div id="alerta-sistema" class="alert d-none" role="alert"></div>
                        <form data-form="registro" method="post" action="#">
                            <div class="row g-3">
                                <div class="col-md-6">
                                    <label for="nombres" class="form-label">Nombres</label>
                                    <input class="form-control" id="nombres" name="nombres" required>
                                </div>
                                <div class="col-md-6">
                                    <label for="apellidos" class="form-label">Apellidos</label>
                                    <input class="form-control" id="apellidos" name="apellidos" required>
                                </div>
                                <div class="col-md-6">
                                    <label for="tipo_documento" class="form-label">Tipo de documento</label>
                                    <select class="form-select" id="tipo_documento" name="tipo_documento" required>
                                        <option value="">Selecciona�?�</option>
                                        <option value="CC">Cédula de ciudadanía</option>
                                        <option value="TI">Tarjeta de identidad</option>
                                        <option value="CE">Cédula de extranjería</option>
                                        <option value="PP">Pasaporte</option>
                                    </select>
                                </div>
                                <div class="col-md-6">
                                    <label for="documento" class="form-label">Número de documento</label>
                                    <input class="form-control" id="documento" name="documento" required>
                                </div>
                                <div class="col-md-6">
                                    <label for="correo" class="form-label">Correo electrónico</label>
                                    <input class="form-control" type="email" id="correo" name="correo" required>
                                </div>
                                <div class="col-md-6">
                                    <label for="telefono" class="form-label">Teléfono / WhatsApp</label>
                                    <input class="form-control" type="tel" id="telefono" name="telefono" required>
                                </div>
                                <div class="col-md-6">
                                    <label for="fecha_nacimiento" class="form-label">Fecha de nacimiento</label>
                                    <input class="form-control" type="date" id="fecha_nacimiento" name="fecha_nacimiento">
                                </div>
                                <div class="col-md-6">
                                    <label for="clave" class="form-label">Contraseña</label>
                                    <input class="form-control" type="password" id="clave" name="clave" required>
                                </div>
                            </div>
                            <div class="form-check my-3">
                                <input class="form-check-input" type="checkbox" id="habeas" name="habeas" required>
                                <label class="form-check-label small" for="habeas">
                                    Acepto el tratamiento de datos conforme a la <a href="privacidad.html">Ley 1581 de 2012</a>
                                </label>
                            </div>
                            <button type="submit" class="btn w-100 text-white" style="background:var(--clinicita-mid);">Crear cuenta</button>
                        </form>
                        <p class="small text-center mt-3 mb-0">¿Ya tienes cuenta? <a href="login.html">Inicia sesión</a></p>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="../assets/js/app.js"></script>
</body>
</html>
