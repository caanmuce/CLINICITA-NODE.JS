<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Iniciar sesión | CliniCita</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/estilos.css">
</head>
<body class="auth-page d-flex align-items-center py-5">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                <p class="text-center mb-4"><a href="../index.html" class="navbar-brand-text text-decoration-none"><i class="bi bi-heart-pulse-fill me-1"></i>Clini<span>Cita</span></a></p>
                <div class="auth-card">
                    <div class="auth-head"><h1 class="h5 mb-0">Iniciar sesión</h1></div>
                    <div class="p-4">
                        <div id="alerta-sistema" class="alert d-none" role="alert"></div>
                        <form data-form="login" method="post" action="#">
                            <div class="mb-3">
                                <label for="rol" class="form-label">Tipo de usuario</label>
                                <select class="form-select" id="rol" name="rol" required>
                                    <option value="">Selecciona tu rol�?�</option>
                                    <option value="paciente">Paciente</option>
                                    <option value="medico">Médico</option>
                                    <option value="recepcionista">Recepcionista</option>
                                    <option value="administrador">Administrador</option>
                                </select>
                            </div>
                            <div class="mb-3">
                                <label for="correo" class="form-label">Correo electrónico</label>
                                <input class="form-control" type="email" id="correo" name="correo" required>
                            </div>
                            <div class="mb-3">
                                <label for="clave" class="form-label">Contraseña</label>
                                <input class="form-control" type="password" id="clave" name="clave" required>
                            </div>
                            <div class="form-check mb-3">
                                <input class="form-check-input" type="checkbox" id="recordar" name="recordar">
                                <label class="form-check-label" for="recordar">Recordar sesión</label>
                            </div>
                            <button type="submit" class="btn btn-clinicita w-100">Ingresar</button>
                        </form>
                        <p class="small text-center mt-3 mb-0">
                            <a href="recuperar.html">¿Olvidaste tu contraseña?</a><br>
                            ¿No tienes cuenta? <a href="registro.html">Regístrate</a>
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="../assets/js/app.js"></script>
</body>
</html>
