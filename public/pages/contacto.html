<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Contacto | CliniCita</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/estilos.css">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark navbar-clinicita">
    <div class="container">
        <a class="navbar-brand navbar-brand-text" href="../index.html"><i class="bi bi-heart-pulse-fill me-1"></i>Clini<span>Cita</span></a>
        <a class="btn btn-clinicita btn-sm" href="login.html">Iniciar sesión</a>
    </div>
</nav>
<header class="page-hero"><div class="container"><h1 class="h2 mb-0">Contacto</h1></div></header>
<main class="container py-5">
    <div class="row g-4">
        <div class="col-lg-6">
            <div class="panel-card">
                <div id="alerta-sistema" class="alert d-none" role="alert"></div>
                <form data-form="contacto" method="post" action="#">
                    <div class="mb-3">
                        <label for="nombre" class="form-label">Nombre</label>
                        <input class="form-control" id="nombre" name="nombre" required>
                    </div>
                    <div class="mb-3">
                        <label for="correo" class="form-label">Correo</label>
                        <input class="form-control" type="email" id="correo" name="correo" required>
                    </div>
                    <div class="mb-3">
                        <label for="asunto" class="form-label">Asunto</label>
                        <input class="form-control" id="asunto" name="asunto" required>
                    </div>
                    <div class="mb-3">
                        <label for="mensaje" class="form-label">Mensaje</label>
                        <textarea class="form-control" id="mensaje" name="mensaje" rows="5" required></textarea>
                    </div>
                    <button type="submit" class="btn btn-clinicita">Enviar</button>
                </form>
            </div>
        </div>
        <div class="col-lg-6">
            <div class="panel-card h-100">
                <h2 class="h5">Datos de la IPS</h2>
                <p class="text-muted small mb-2">Completar con la información real de la institución.</p>
                <ul class="list-unstyled mb-0">
                    <li class="mb-2"><i class="bi bi-geo-alt text-success me-2"></i><span>Dirección (pendiente)</span></li>
                    <li class="mb-2"><i class="bi bi-telephone text-success me-2"></i><span>Teléfono (pendiente)</span></li>
                    <li class="mb-2"><i class="bi bi-envelope text-success me-2"></i><span>Correo (pendiente)</span></li>
                    <li><i class="bi bi-clock text-success me-2"></i><span>Horario de atención (pendiente)</span></li>
                </ul>
            </div>
        </div>
    </div>
</main>
<footer class="footer-clinicita py-3 text-center small">&copy; 2026 CliniCita · <a href="../index.html">Inicio</a></footer>
<script src="../assets/js/app.js"></script>
</body>
</html>
