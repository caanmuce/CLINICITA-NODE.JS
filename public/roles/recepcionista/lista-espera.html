<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Lista de espera | CliniCita</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../assets/css/estilos.css">
</head>
<body class="app-shell">
<div class="container-fluid">
    <div class="row">
        <aside class="col-lg-2 app-sidebar">
            <a class="navbar-brand-text d-block mb-4 text-decoration-none" href="../../index.html"><i class="bi bi-heart-pulse-fill me-1"></i>Clini<span>Cita</span></a>
            <p class="small text-white-50 mb-3">Recepcionista</p>
            <nav class="nav flex-column">
                <a class="nav-link" href="citas.html"><i class="bi bi-calendar-check me-2"></i>Citas</a>
                <a class="nav-link active" href="lista-espera.html"><i class="bi bi-hourglass-split me-2"></i>Lista de espera</a>
                <a class="nav-link" href="../../pages/login.html"><i class="bi bi-box-arrow-left me-2"></i>Salir</a>
            </nav>
        </aside>
        <main class="col-lg-10 app-content">
            <h1 class="h3 mb-4">Lista de espera</h1>
            <div class="panel-card mb-4">
                <h2 class="h6">Inscribir paciente</h2>
                <div id="alerta-sistema" class="alert d-none" role="alert"></div>
                <form data-form="lista-espera" class="row g-2" method="post" action="#">
                    <div class="col-md-4"><input class="form-control" name="documento" placeholder="Documento del paciente" required></div>
                    <div class="col-md-3">
                        <select class="form-select" name="especialidad_id" required>
                            <option value="">Especialidad</option>
                            <!-- TODO: GET /api/especialidades -->
                        </select>
                    </div>
                    <div class="col-md-3">
                        <select class="form-select" name="prioridad">
                            <option value="normal">Prioridad normal</option>
                            <option value="alta">Prioridad alta</option>
                        </select>
                    </div>
                    <div class="col-md-2"><button class="btn btn-clinicita w-100" type="submit">Inscribir</button></div>
                </form>
            </div>
            <div class="panel-card">
                <div class="table-responsive">
                    <table class="table align-middle">
                        <thead>
                            <tr>
                                <th>Orden</th>
                                <th>Paciente</th>
                                <th>Especialidad</th>
                                <th>Prioridad</th>
                                <th>Fecha de ingreso</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="tabla-espera">
                            <!-- TODO: GET /api/lista-espera -->
                        </tbody>
                    </table>
                </div>
                <div class="empty-state">
                    <i class="bi bi-hourglass"></i>
                    La lista de espera está vacía.
                </div>
            </div>
        </main>
    </div>
</div>
<script src="../../assets/js/app.js"></script>
</body>
</html>
