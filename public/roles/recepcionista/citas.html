<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Gestión de citas | CliniCita</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../assets/css/estilos.css">
</head>
<body class="app-shell">
<div class="container-fluid">
    <div class="row">
        <aside class="col-lg-2 app-sidebar">
            <a class="navbar-brand-text d-block mb-4 text-decoration-none" href="../../index.html"><i class="bi bi-heart-pulse-fill me-1"></i>Clini<span>Cita</span></a>
            <p class="small text-white-50 mb-3">Recepcionista</p>
            <nav class="nav flex-column">
                <a class="nav-link active" href="citas.html"><i class="bi bi-calendar-check me-2"></i>Citas</a>
                <a class="nav-link" href="lista-espera.html"><i class="bi bi-hourglass-split me-2"></i>Lista de espera</a>
                <a class="nav-link" href="../../pages/login.html"><i class="bi bi-box-arrow-left me-2"></i>Salir</a>
            </nav>
        </aside>
        <main class="col-lg-10 app-content">
            <h1 class="h3 mb-4">Gestión de citas</h1>
            <div class="panel-card mb-4">
                <form class="row g-2" id="filtros-citas">
                    <div class="col-md-3"><input class="form-control" type="date" name="fecha" aria-label="Fecha"></div>
                    <div class="col-md-3">
                        <select class="form-select" name="estado" aria-label="Estado">
                            <option value="">Todos los estados</option>
                            <option value="pendiente">Pendiente</option>
                            <option value="confirmada">Confirmada</option>
                            <option value="cancelada">Cancelada</option>
                            <option value="atendida">Atendida</option>
                            <option value="inasistencia">Inasistencia</option>
                        </select>
                    </div>
                    <div class="col-md-4"><input class="form-control" type="search" name="q" placeholder="Buscar por paciente o documento"></div>
                    <div class="col-md-2"><button class="btn btn-clinicita w-100" type="button">Buscar</button></div>
                </form>
            </div>
            <div class="panel-card">
                <div class="table-responsive">
                    <table class="table align-middle">
                        <thead>
                            <tr>
                                <th>Fecha</th>
                                <th>Hora</th>
                                <th>Paciente</th>
                                <th>Médico</th>
                                <th>Especialidad</th>
                                <th>Estado</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="tabla-citas">
                            <!-- TODO: GET /api/citas -->
                        </tbody>
                    </table>
                </div>
                <div class="empty-state">
                    <i class="bi bi-calendar-x"></i>
                    No hay citas para mostrar. Conectar listado con la base de datos.
                </div>
            </div>
        </main>
    </div>
</div>
<script src="../../assets/js/app.js"></script>
</body>
</html>
