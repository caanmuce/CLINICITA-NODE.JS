<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Panel del paciente | CliniCita</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../assets/css/estilos.css">
</head>
<body class="app-shell">
<div class="container-fluid">
    <div class="row">
        <aside class="col-lg-2 app-sidebar">
            <a class="navbar-brand-text d-block mb-4 text-decoration-none" href="../../index.html"><i class="bi bi-heart-pulse-fill me-1"></i>Clini<span>Cita</span></a>
            <p class="small text-white-50 mb-3">Paciente</p>
            <nav class="nav flex-column">
                <a class="nav-link active" href="dashboard.html"><i class="bi bi-grid me-2"></i>Inicio</a>
                <a class="nav-link" href="agendar.html"><i class="bi bi-calendar-plus me-2"></i>Agendar cita</a>
                <a class="nav-link" href="mis-citas.html"><i class="bi bi-calendar3 me-2"></i>Mis citas</a>
                <a class="nav-link" href="perfil.html"><i class="bi bi-person me-2"></i>Perfil</a>
                <a class="nav-link" href="../../pages/login.html"><i class="bi bi-box-arrow-left me-2"></i>Salir</a>
            </nav>
        </aside>
        <main class="col-lg-10 app-content">
            <h1 class="h3 mb-4">Resumen</h1>
            <div class="row g-3 mb-4">
                <div class="col-md-4"><div class="kpi-card"><div class="small text-muted">Próximas citas</div><div class="kpi-value" id="kpi-proximas">0</div></div></div>
                <div class="col-md-4"><div class="kpi-card"><div class="small text-muted">Pendientes de confirmar</div><div class="kpi-value" id="kpi-pendientes">0</div></div></div>
                <div class="col-md-4"><div class="kpi-card"><div class="small text-muted">En lista de espera</div><div class="kpi-value" id="kpi-espera">0</div></div></div>
            </div>
            <div class="panel-card">
                <h2 class="h5">Próxima cita</h2>
                <div class="empty-state" id="empty-proxima">
                    <i class="bi bi-calendar-x"></i>
                    No hay citas programadas.
                    <div class="mt-3"><a class="btn btn-clinicita btn-sm" href="agendar.html">Agendar cita</a></div>
                </div>
                <div class="d-none" id="contenido-proxima">
                    <div class="d-flex justify-content-between align-items-start mb-2">
                        <div>
                            <div class="fw-bold" id="proxima-fecha">--</div>
                            <div class="text-muted small" id="proxima-hora">--</div>
                        </div>
                        <span class="badge" id="proxima-especialidad">--</span>
                    </div>
                    <div class="small text-muted" id="proxima-medico">--</div>
                    <div class="small mt-1" id="proxima-estado">--</div>
                </div>
            </div>
                </div>
</div>
<script src="../../assets/js/app.js"></script>
</body>
</html>
