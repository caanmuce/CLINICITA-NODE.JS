<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Mi perfil | CliniCita</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../assets/css/estilos.css">
</head>
<body class="app-shell">
<div class="container-fluid">
    <div class="row">
        <aside class="col-lg-2 app-sidebar">
            <a class="navbar-brand-text d-block mb-4 text-decoration-none" href="../../index.html"><i class="bi bi-heart-pulse-fill me-1"></i>Clini<span>Cita</span></a>
            <p class="small text-white-50 mb-3">Paciente</p>
            <nav class="nav flex-column">
                <a class="nav-link" href="dashboard.html"><i class="bi bi-grid me-2"></i>Inicio</a>
                <a class="nav-link" href="agendar.html"><i class="bi bi-calendar-plus me-2"></i>Agendar cita</a>
                <a class="nav-link" href="mis-citas.html"><i class="bi bi-calendar3 me-2"></i>Mis citas</a>
                <a class="nav-link active" href="perfil.html"><i class="bi bi-person me-2"></i>Perfil</a>
                <a class="nav-link" id="btn-logout" href="../../pages/login.html"><i class="bi bi-box-arrow-left me-2"></i>Salir</a>
            </nav>
        </aside>
        <main class="col-lg-10 app-content">
            <h1 class="h3 mb-4">Perfil</h1>
            <div class="panel-card">
                <div id="alerta-sistema" class="alert d-none" role="alert"></div>
                <form data-form="perfil" method="post" action="#">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label for="nombres" class="form-label">Nombres</label>
                            <input class="form-control" id="nombres" name="nombres">
                        </div>
                        <div class="col-md-6">
                            <label for="apellidos" class="form-label">Apellidos</label>
                            <input class="form-control" id="apellidos" name="apellidos">
                        </div>
                        <div class="col-md-6">
                            <label for="correo" class="form-label">Correo</label>
                            <input class="form-control" type="email" id="correo" name="correo">
                        </div>
                        <div class="col-md-6">
                            <label for="telefono" class="form-label">Teléfono / WhatsApp</label>
                            <input class="form-control" type="tel" id="telefono" name="telefono">
                        </div>
                        <div class="col-12">
                            <label for="direccion" class="form-label">Dirección</label>
                            <input class="form-control" id="direccion" name="direccion">
                        </div>
                    </div>
                    <button type="submit" class="btn btn-clinicita mt-3">Guardar cambios</button>
                </form>
                <p class="text-muted small mt-3 mb-0">TODO: precargar campos con GET /api/usuarios/me</p>
            </div>
        </main>
    </div>
</div>
<script src="../../assets/js/app.js"></script>
</body>
</html>
