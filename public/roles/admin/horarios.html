<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Horarios | CliniCita</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../assets/css/estilos.css">
</head>
<body class="app-shell">
<div class="container-fluid">
    <div class="row">
        <aside class="col-lg-2 app-sidebar">
            <a class="navbar-brand-text d-block mb-4 text-decoration-none" href="../../index.html"><i class="bi bi-heart-pulse-fill me-1"></i>Clini<span>Cita</span></a>
            <p class="small text-white-50 mb-3">Administrador</p>
            <nav class="nav flex-column">
                <a class="nav-link" href="dashboard.html"><i class="bi bi-speedometer2 me-2"></i>Panel</a>
                <a class="nav-link" href="usuarios.html"><i class="bi bi-people me-2"></i>Usuarios</a>
                <a class="nav-link" href="especialidades.html"><i class="bi bi-heart-pulse me-2"></i>Especialidades</a>
                <a class="nav-link active" href="horarios.html"><i class="bi bi-clock me-2"></i>Horarios</a>
                <a class="nav-link" href="reportes.html"><i class="bi bi-graph-up me-2"></i>Reportes</a>
                <a class="nav-link" href="../../pages/login.html"><i class="bi bi-box-arrow-left me-2"></i>Salir</a>
            </nav>
        </aside>
        <main class="col-lg-10 app-content">
            <h1 class="h3 mb-4">Horarios de atención</h1>
            <div class="panel-card mb-4">
                <form class="row g-2" method="post" action="#" data-form="horario">
                    <div class="col-md-3">
                        <select class="form-select" name="medico_id" required>
                            <option value="">Médico</option>
                            <!-- TODO: GET /api/medicos -->
                        </select>
                    </div>
                    <div class="col-md-2">
                        <select class="form-select" name="dia" required>
                            <option value="">Día</option>
                            <option value="1">Lunes</option>
                            <option value="2">Martes</option>
                            <option value="3">Miércoles</option>
                            <option value="4">Jueves</option>
                            <option value="5">Viernes</option>
                            <option value="6">Sábado</option>
                            <option value="0">Domingo</option>
                        </select>
                    </div>
                    <div class="col-md-2"><input class="form-control" type="time" name="hora_inicio" required></div>
                    <div class="col-md-2"><input class="form-control" type="time" name="hora_fin" required></div>
                    <div class="col-md-2"><input class="form-control" type="number" name="duracion" min="10" placeholder="Duración (min)"></div>
                    <div class="col-md-1"><button class="btn btn-clinicita w-100" type="submit">+</button></div>
                </form>
            </div>
            <div class="panel-card">
                <div class="table-responsive">
                    <table class="table">
                        <thead>
                            <tr><th>Médico</th><th>Día</th><th>Inicio</th><th>Fin</th><th>Duración</th><th>Acciones</th></tr>
                        </thead>
                        <tbody id="tabla-horarios"><!-- TODO: GET /api/horarios --></tbody>
                    </table>
                </div>
                <div class="empty-state"><i class="bi bi-clock"></i>Sin horarios configurados.</div>
            </div>
        </main>
    </div>
</div>
<script src="../../assets/js/app.js"></script>
</body>
</html>
