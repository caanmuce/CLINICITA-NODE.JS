<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Agenda médica | CliniCita</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../assets/css/estilos.css">
    <!-- NUEVO: estilos de los paneles médico/admin -->
    <link rel="stylesheet" href="../../assets/css/panel.css">
</head>
<body class="app-shell" data-pagina="medico-agenda">
<div class="container-fluid">
    <div class="row">
        <aside class="col-lg-2 app-sidebar">
            <a class="navbar-brand-text d-block mb-4 text-decoration-none" href="../../index.html"><i class="bi bi-heart-pulse-fill me-1"></i>Clini<span>Cita</span></a>
            <p class="small text-white-50 mb-2">Médico</p>
            <!-- NUEVO: panel-comun.js escribe aquí el nombre del usuario conectado -->
            <div class="sidebar-usuario" id="sidebar-usuario"></div>
            <nav class="nav flex-column">
                <a class="nav-link active" href="agenda.html"><i class="bi bi-calendar3 me-2"></i>Agenda del día</a>
                <!-- CAMBIO: id="btn-logout" -> app.js ya sabe cerrar sesión (borra el token) con ese id -->
                <a class="nav-link" id="btn-logout" href="../../pages/login.html"><i class="bi bi-box-arrow-left me-2"></i>Salir</a>
            </nav>
        </aside>
        <main class="col-lg-10 app-content">
            <div class="panel-encabezado">
                <div>
                    <h1 class="h3 mb-0">Agenda del día</h1>
                    <!-- medico.js escribe aquí "Dra. Laura Gómez · Pediatría" -->
                    <p class="panel-subtitulo sin-capitalizar" id="medico-info">Cargando tu información...</p>
                </div>
                <!-- Selector de fecha: al cambiarla, la agenda se recarga sola -->
                <form class="d-flex flex-wrap gap-2 align-items-center" id="filtro-fecha">
                    <button class="btn btn-outline-clinicita btn-sm" type="button" id="btn-dia-anterior" aria-label="Día anterior" title="Día anterior"><i class="bi bi-chevron-left"></i></button>
                    <input class="form-control" type="date" name="fecha" id="fecha-agenda" aria-label="Fecha de agenda" style="width:auto;">
                    <button class="btn btn-outline-clinicita btn-sm" type="button" id="btn-dia-siguiente" aria-label="Día siguiente" title="Día siguiente"><i class="bi bi-chevron-right"></i></button>
                    <button class="btn btn-clinicita btn-sm" type="button" id="btn-hoy"><i class="bi bi-calendar-check me-1"></i>Hoy</button>
                </form>
            </div>

            <div class="row g-3 mb-4">
                <div class="col-6 col-md-4 col-xl"><div class="kpi-card kpi-con-icono"><div class="kpi-icono kpi-azul"><i class="bi bi-calendar2-check"></i></div><div><div class="small text-muted">Confirmadas</div><div class="kpi-value" id="kpi-confirmadas">–</div></div></div></div>
                <div class="col-6 col-md-4 col-xl"><div class="kpi-card kpi-con-icono"><div class="kpi-icono kpi-ambar"><i class="bi bi-hourglass-split"></i></div><div><div class="small text-muted">Pendientes</div><div class="kpi-value" id="kpi-pendientes">–</div></div></div></div>
                <div class="col-6 col-md-4 col-xl"><div class="kpi-card kpi-con-icono"><div class="kpi-icono kpi-gris"><i class="bi bi-x-circle"></i></div><div><div class="small text-muted">Canceladas</div><div class="kpi-value" id="kpi-canceladas">–</div></div></div></div>
                <div class="col-6 col-md-4 col-xl"><div class="kpi-card kpi-con-icono"><div class="kpi-icono kpi-verde"><i class="bi bi-check2-circle"></i></div><div><div class="small text-muted">Atendidas</div><div class="kpi-value" id="kpi-atendidas">–</div></div></div></div>
                <div class="col-6 col-md-4 col-xl"><div class="kpi-card kpi-con-icono"><div class="kpi-icono kpi-rojo"><i class="bi bi-person-x"></i></div><div><div class="small text-muted">Inasistencias</div><div class="kpi-value" id="kpi-inasistencias">–</div></div></div></div>
            </div>

            <div class="panel-card">
                <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
                    <h2 class="h6 mb-0" id="titulo-fecha">&nbsp;</h2>
                    <span class="small text-muted" id="ultima-actualizacion"></span>
                </div>
                <div class="table-responsive">
                    <!-- tabla-apilable: en celular cada cita se muestra como tarjeta (ver panel.css) -->
                    <table class="table align-middle tabla-panel tabla-apilable">
                        <thead>
                            <tr>
                                <th>Hora</th>
                                <th>Paciente</th>
                                <th>Documento</th>
                                <th>Motivo</th>
                                <th>Estado</th>
                                <th>Asistencia</th>
                            </tr>
                        </thead>
                        <tbody id="tabla-agenda"></tbody>
                    </table>
                </div>
                <div class="empty-state d-none" id="vacio-agenda">
                    <i class="bi bi-clipboard2-pulse"></i>
                    No hay pacientes en la agenda para esta fecha.
                </div>
            </div>
        </main>
    </div>
</div>
<!-- NUEVO: el JS de Bootstrap (ventanas modales) va en una copia LOCAL, no desde internet:
     server.js usa helmet, y su política de seguridad solo permite scripts del propio sitio
     (script-src 'self'). Cargarlo desde un CDN lo bloquearía y los modales no abrirían. -->
<script src="../../assets/js/vendor/bootstrap.bundle.min.js"></script>
<!-- El ORDEN importa: app.js (api, logout, control de rol) -> panel-comun.js -> medico.js -->
<script src="../../assets/js/app.js"></script>
<script src="../../assets/js/panel-comun.js"></script>
<script src="../../assets/js/medico.js"></script>
</body>
</html>
